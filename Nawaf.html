<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nawaf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap">
<style>
/* Layout: big name over a small code-window card holding the major, centered on a glowing colour field. Name and major only. */
:root {
  --bg: #0d1020;
  --fg: #f5f6ff;
  --muted: #9aa0c4;
  --win: #161a30;
  --line: #2b3157;
  --coral: #ff6b57;
  --amber: #ffc233;
  --mint: #34e0b4;
  --sky: #5aa9ff;
  --glow-a: rgba(255, 107, 87, 0.28);
  --glow-b: rgba(52, 224, 180, 0.22);
  --glow-c: rgba(255, 194, 51, 0.16);
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef2ff; --fg: #141735; --muted: #565c85; --win: #ffffff; --line: #d3d9f5;
    --coral: #f2432d; --amber: #e79a00; --mint: #0a9b78; --sky: #1f6fe0;
    --glow-a: rgba(255, 107, 87, 0.28); --glow-b: rgba(52, 224, 180, 0.28); --glow-c: rgba(255, 194, 51, 0.3);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef2ff; --fg: #141735; --muted: #565c85; --win: #ffffff; --line: #d3d9f5;
  --coral: #f2432d; --amber: #e79a00; --mint: #0a9b78; --sky: #1f6fe0;
  --glow-a: rgba(255, 107, 87, 0.28); --glow-b: rgba(52, 224, 180, 0.28); --glow-c: rgba(255, 194, 51, 0.3);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--fg);
  background:
    radial-gradient(60% 45% at 85% 8%, var(--glow-a), transparent 70%),
    radial-gradient(55% 45% at 8% 92%, var(--glow-b), transparent 70%),
    radial-gradient(40% 30% at 90% 90%, var(--glow-c), transparent 70%),
    var(--bg);
  display: grid;
  place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
h1 {
  font-family: var(--font-display);
  font-size: clamp(60px, 22vw, 96px);
  line-height: 1;
  letter-spacing: -0.03em;
  margin: 0;
  text-align: center;
}
h1 span { color: var(--coral); }
.win {
  width: 100%;
  background: var(--win);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 18px 50px -20px var(--glow-a);
}
.bar { display: flex; gap: 7px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.bar i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.bar i:nth-child(1) { background: var(--coral); }
.bar i:nth-child(2) { background: var(--amber); }
.bar i:nth-child(3) { background: var(--mint); }
.code {
  margin: 0; padding: 20px 18px;
  font-family: var(--font-mono); font-size: 14px; line-height: 1.6;
  overflow-wrap: anywhere; white-space: pre-wrap;
}
.p { color: var(--mint); }
.k { color: var(--sky); }
.s { color: var(--amber); }
.cur {
  display: inline-block; width: 8px; height: 1.1em; vertical-align: text-bottom;
  background: var(--coral); margin-left: 3px;
  animation: blink 1.1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
</style>

<main>
  <h1>Nawaf<span>.</span></h1>
  <div class="win">
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="code"><span class="p">&gt;</span> <span class="k">major</span> = <span class="s">"Software Engineering"</span><span class="cur" aria-hidden="true"></span></p>
  </div>
</main>

</body></html>
